name: "quarryz"
version: "0.1.0"
profile: "quarryz"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# THE CUT-OFFS THE GATE COMPARES. `warehouse` is what we already hold and `incoming` is the load
# arriving. Both are dates rather than files, because the committed corpus is bitemporal and any
# moment can be reconstructed from it by filtering: that is the whole reason it is stored that
# way rather than as a pile of downloaded documents.
vars:
  warehouse_as_at: "2023-06"
  incoming_as_at: "2023-12"
  vintages: "../src/quarryz/data/vintages"
  # THE LEDGER IS ITS OWN VAR AND NOT DERIVED FROM THE VINTAGES PATH. It was
  # `{{ var("vintages") }}/../declared_revisions.csv`, and overriding one var to point the
  # ledger elsewhere then moved the data with it, so the harness that empties the ledger to
  # prove the gate fails could not find the corpus either. Two things, two names.
  ledger: "../src/quarryz/data/declared_revisions.csv"

models:
  quarryz:
    +materialized: table
