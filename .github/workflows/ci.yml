name: CI

# Nothing here reaches a cloud account and nothing here needs a credential.
#
# The jobs arrive as the legs do. This one runs the offline suite, which is everything a
# stranger gets by cloning the repository and running pytest with nothing else installed. The
# legs that need an engine binary, an S3 emulator or a PostgreSQL get their own jobs as they
# arrive, so the boundary of the test rig stays legible rather than being blurred into one
# green tick.
#
# Third-party actions are pinned by commit from the first one, with the version in a comment.
# A sibling repository shipped twelve floating major tags under a file claiming every workflow
# pinned an exact version, and the pins were added afterwards.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      # THE ENGINE GROUP IS SYNCED HERE AND THE OFFLINE SUITE STILL DOES NOT USE IT, which is
      # not a contradiction: pytest and mypy need different things. Every test in the offline
      # suite reads committed JSON and imports nothing from pyiceberg, moto or duckdb, so
      # cloning this and running pytest with `--dev` alone still works, which is the claim.
      # mypy is a different tool: it cannot check a file whose imports it cannot resolve, and
      # leaving scripts/measure_snapshots.py unchecked, or declaring pyiceberg untyped when it
      # ships a py.typed marker, would both be worse than one slower install.
      sync-args: "--dev --group engines"
      run-mypy: true

  # The engine measurements, re-run rather than trusted. docs/evidence/collapse was produced by
  # the same script on a laptop, and a committed artefact nobody regenerates is a claim about
  # the past. This fetches the same pinned ClickHouse and diffs the summary.
  #
  # SEPARATE FROM THE OFFLINE SUITE ON PURPOSE. It downloads 167 MB and the offline suite must
  # stay the thing a stranger gets by cloning and running pytest with nothing installed.
  collapse:
    name: what the engine does to a vintage, measured again
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: fetch the engine, verified against the vendor's own sha512 on this platform
        run: scripts/fetch_tools.sh
      - name: measure it again
        run: scripts/measure_collapse.sh
      - name: fail if any measured outcome or transcript has changed
        run: |
          # THE WHOLE DIRECTORY, AND IT USED TO BE summary.json ALONE. The transcripts are what a
          # reader actually reads, and nothing compared them: a harness could have gone on writing
          # a correct summary beside a transcript describing a build that no longer existed, and
          # this step would have stayed green. The gate transcript had to be stabilised before
          # this was possible, because dbt stamps a wall clock on every line it prints.
          #
          # `git status` as well as `git diff`, because a diff says nothing about a file the
          # harness has newly created and nobody has committed.
          git status --porcelain docs/evidence/collapse
          git diff --exit-code -- docs/evidence/collapse
          test -z "$(git status --porcelain docs/evidence/collapse)"

  # The demo, which is the one thing here a reader can run without installing an engine, an S3
  # emulator or a database. Its captured output is what the portfolio card shows, so it is
  # regenerated on every push and the build fails if a byte moved.
  demo:
    name: the demo a reader can run with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # THE DOCUMENTED LINE, RUN AS WRITTEN. The capture below invokes the same file through
      # subprocess, which proves the demo works and not that the command the README hands a
      # reader does. Those are different claims and the second one is the one a stranger tests.
      - name: run the demo exactly as the README tells a reader to
        run: uv run python examples/what_the_publisher_changed.py
      - name: run the demo and capture what it printed
        run: uv run python scripts/capture_evidence.py
      - name: fail if the captured output has changed
        run: |
          git status --porcelain docs/evidence/demo.txt
          git diff --exit-code -- docs/evidence/demo.txt
          test -z "$(git status --porcelain docs/evidence/demo.txt)"

  # The Iceberg leg. Needs moto, pyiceberg and pyarrow, which the offline suite deliberately
  # does not, so it is its own job and the boundary of the test rig stays legible.
  snapshots:
    name: a snapshot is not a vintage, measured against a real S3 endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: load the same corpus twice and then the revised one
        run: uv run --group engines python scripts/measure_snapshots.py
      - name: fail if any measured outcome or transcript has changed
        run: |
          git status --porcelain docs/evidence/snapshots
          git diff --exit-code -- docs/evidence/snapshots
          test -z "$(git status --porcelain docs/evidence/snapshots)"

  # The gate itself. Runs dbt twice, once with the ledger emptied so the failure is observed
  # rather than asserted, and once with the committed ledger so the gate is known to be
  # satisfiable. Its own job because it needs dbt and DuckDB, which the offline suite does not.
  gate:
    name: a publisher rewriting history fails this build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: build it with the ledger emptied and then with the ledger
        run: scripts/measure_gate.sh
      - name: fail if any measured outcome or transcript has changed
        run: |
          git status --porcelain docs/evidence/gate
          git diff --exit-code -- docs/evidence/gate
          test -z "$(git status --porcelain docs/evidence/gate)"

  # One as-of question asked of three engines in three idioms. Needs a ClickHouse binary, DuckDB
  # and a real PostgreSQL, so it is its own job with its own service.
  agreement:
    name: three engines, one question, and the tie that decides it
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quarryz
          POSTGRES_PASSWORD: quarryz-demo
          POSTGRES_DB: quarryz
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quarryz -d quarryz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUARRYZ_POSTGRES: postgresql://quarryz:quarryz-demo@127.0.0.1:5433/quarryz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: fetch the engine, verified against the vendor's own sha512 on this platform
        run: scripts/fetch_tools.sh
      - name: ask all three at both moments
        run: uv run --group engines python scripts/measure_agreement.py
      - name: fail if any measured outcome or transcript has changed
        run: |
          git status --porcelain docs/evidence/agreement
          git diff --exit-code -- docs/evidence/agreement
          test -z "$(git status --porcelain docs/evidence/agreement)"
