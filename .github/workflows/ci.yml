name: CI

# Nothing here reaches a cloud account and nothing here needs a credential.
#
# The jobs arrive as the legs do. This one runs the offline suite, which is everything a
# stranger gets by cloning the repository and running pytest with nothing else installed. The
# legs that need an engine binary, an S3 emulator or a PostgreSQL get their own jobs as they
# arrive, so the boundary of the test rig stays legible rather than being blurred into one
# green tick.
#
# Third-party actions are pinned by commit from the first one, with the version in a comment.
# A sibling repository shipped twelve floating major tags under a file claiming every workflow
# pinned an exact version, and the pins were added afterwards.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # The engine measurements, re-run rather than trusted. docs/evidence/collapse was produced by
  # the same script on a laptop, and a committed artefact nobody regenerates is a claim about
  # the past. This fetches the same pinned ClickHouse and diffs the summary.
  #
  # SEPARATE FROM THE OFFLINE SUITE ON PURPOSE. It downloads 167 MB and the offline suite must
  # stay the thing a stranger gets by cloning and running pytest with nothing installed.
  collapse:
    name: what the engine does to a vintage, measured again
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: fetch the engine, verified against the vendor's own sha512 on this platform
        run: scripts/fetch_tools.sh
      - name: measure it again
        run: scripts/measure_collapse.sh
      - name: fail if any measured outcome has changed
        run: git diff --exit-code -- docs/evidence/collapse/summary.json
